name: Metrics + README (2× / day)

on:
  # ── twice‑a‑day (adjust the hours if you prefer another window) ──
  schedule:
    - cron: "0 6,18 * * *"
  # ── manual trigger from the Actions UI ──
  workflow_dispatch:
  # ── also run on normal pushes so the badge stays fresh ──
  push:
    branches: [master, main]

# The workflow needs write permission to push the updated README/metrics.svg
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production               # keeps your protected env / secrets

    steps:
      # --------------------------------------------------------------
      # 1️⃣  Checkout the repo **with a token** so we can commit later
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            # full history → clean commit

      # --------------------------------------------------------------
      # 2️⃣  Generate **metrics.svg** (your existing lowlighter/metrics step)
      # --------------------------------------------------------------
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hugoxbaca
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Atlantic/Reykjavik
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_gists: yes
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 5
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic
          plugin_stargazers_days: 14
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars

      # --------------------------------------------------------------
      # 3️⃣  **Inject / refresh the SVG inside README.md**
      # --------------------------------------------------------------
      # We look for a marker pair in README.md:
      #   <!--METRICS_START-->
      #   <!--METRICS_END-->
      # Everything between them is replaced with a fresh image link.
      # If the markers are absent we append the image at the top of the file.
      - name: Update README.md with new metrics.svg
        id: update_readme
        run: |
          set -euo pipefail

          MARKER_START='<!--METRICS_START-->'
          MARKER_END='<!--METRICS_END-->'
          IMG_LINE='![GitHub Metrics](metrics.svg)'

          # Read current README
          README="README.md"
          if [[ ! -f "$README" ]]; then
            echo "# Hugo Baca" > "$README"
          fi

          # Build the new block
          NEW_BLOCK="${MARKER_START}\n${IMG_LINE}\n${MARKER_END}"

          # Use awk to replace the block (or prepend if markers missing)
          awk -v start="$MARKER_START" -v end="$MARKER_END" -v block="$NEW_BLOCK" '
            BEGIN { printed=0; in_block=0 }
            $0 ~ start { in_block=1; if (!printed) { print block; printed=1 } next }
            $0 ~ end   { in_block=0; next }
            !in_block { print }
            END { if (!printed) print block }
          ' "$README" > "${README}.tmp" && mv "${README}.tmp" "$README"

          echo "✅ README.md updated (markers ensured)."

      # --------------------------------------------------------------
      # 4️⃣  Commit & push **only if something changed**
      # --------------------------------------------------------------
      - name: Commit & push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the two files we care about
          git add README.md metrics.svg

          # If nothing staged, exit cleanly
          if git diff --cached --quiet; then
            echo "🟢 No changes to commit."
            exit 0
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "chore: auto‑update README & metrics.svg (${TIMESTAMP})"

          # Push to the same branch that triggered the workflow
          git push origin HEAD:${GITHUB_REF#refs/heads/}
